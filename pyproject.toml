[project]
name = "flipbook-maker"
version = "0.1.0"
description = "Format PNG flipbook frames into printable A4 sheets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luan van Pletsen" }]
dependencies = [
    "Pillow>=10.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "py5>=0.10",
]
pdf = [
    "pypdfium2>=4",
]

[project.scripts]
flipbook-make = "flipbook_maker.flipbook.cli:main"
flipbook-tarot = "flipbook_maker.tarot.cli:tarot"
flipbook-cootie = "flipbook_maker.cootie.cli:cootie"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flipbook_maker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
