<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flipbook-maker</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      :root {
        --bg: #1a1a1a;
        --surface: #252525;
        --surface2: #2e2e2e;
        --border: #404040;
        --accent: #7c9edb;
        --accent-hover: #9ab4e8;
        --text: #e0e0e0;
        --text-muted: #888;
        --radius: 6px;
      }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        font-size: 14px;
        min-height: 100vh;
      }

      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0 1.5rem;
        display: flex;
        align-items: center;
        gap: 2rem;
        height: 52px;
      }

      header h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--accent);
      }

      nav { display: flex; gap: 0.25rem; }

      .tab-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 0.45rem 0.9rem;
        border-radius: var(--radius);
        font-size: 0.9rem;
        transition: color 0.15s, background 0.15s;
      }
      .tab-btn:hover { color: var(--text); background: var(--surface2); }
      .tab-btn.active { color: var(--text); background: var(--surface2); }

      main { display: flex; flex-direction: column; }

      .tab-section { display: flex; flex-direction: column; }

      /* ── Flipbook tab layout ── */
      #tab-flipbook {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 52px);
      }

      /* ── Upload area ── */
      #upload-area {
        border-bottom: 1px solid var(--border);
        padding: 0.75rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        background: var(--surface);
      }

      #upload-label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        font-weight: 500;
        padding: 0.45rem 1rem;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 0.88rem;
        white-space: nowrap;
        transition: background 0.15s;
      }
      #upload-label:hover { background: var(--border); }

      #upload-input { display: none; }

      #file-name {
        color: var(--text-muted);
        font-size: 0.85rem;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Advanced settings panel ── */
      #advanced-panel {
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        padding: 1rem 1.5rem;
        overflow-y: auto;
        max-height: 60vh;
      }

      #advanced-panel form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      #advanced-panel fieldset {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin: 0;
        padding: 0.6rem 0.8rem 0.75rem;
        min-width: 180px;
      }
      #advanced-panel legend {
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
        padding: 0 0.3rem;
      }

      .field-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.45rem;
      }
      .field-row:last-child { margin-bottom: 0; }
      .field-row label { color: var(--text-muted); white-space: nowrap; font-size: 0.85rem; }

      .field-row input[type="number"],
      .field-row input[type="text"],
      .field-row select {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius);
        padding: 0.25rem 0.5rem;
        font-size: 0.85rem;
        width: 120px;
        min-width: 0;
      }
      .field-row input[type="number"]:focus,
      .field-row input[type="text"]:focus,
      .field-row select:focus {
        outline: none;
        border-color: var(--accent);
      }

      .field-row.checkbox-row { justify-content: flex-start; gap: 0.5rem; }
      .field-row.checkbox-row label { color: var(--text); }

      .radio-group { display: flex; gap: 0.75rem; }
      .radio-group label { color: var(--text); display: flex; align-items: center; gap: 0.3rem; }

      /* ── Preview area ── */
      #preview-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
      }

      #preview-toolbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 1rem;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      #preview-toolbar button {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius);
        padding: 0.25rem 0.7rem;
        cursor: pointer;
        font-size: 1rem;
      }
      #preview-toolbar button:disabled { opacity: 0.35; cursor: default; }
      #preview-toolbar button:not(:disabled):hover { background: var(--border); }

      #sheet-counter { font-size: 0.85rem; color: var(--text-muted); }

      #preview-actions {
        display: flex;
        gap: 0.5rem;
        margin-left: auto;
      }

      #preview-scroll {
        flex: 1;
        overflow: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 1.5rem;
      }

      #preview-canvas {
        max-width: 100%;
        box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        border-radius: 2px;
      }

      /* ── Action buttons ── */
      .action-btn {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius);
        padding: 0.35rem 0.9rem;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background 0.15s;
      }
      .action-btn:hover:not(:disabled) { background: var(--border); }
      .action-btn:disabled { opacity: 0.35; cursor: default; }

      .action-btn.primary {
        background: var(--accent);
        color: #111;
        font-weight: 600;
        border-color: transparent;
      }
      .action-btn.primary:hover:not(:disabled) { background: var(--accent-hover); }

      #render-progress {
        width: 100%;
        height: 4px;
        border-radius: 2px;
        margin-top: 0.25rem;
      }

      /* ── Tarot & Cootie tab layouts ── */
      #tab-tarot, #tab-cootie {
        flex-direction: row;
        height: calc(100vh - 52px);
      }

      .side-panel {
        width: 280px;
        flex-shrink: 0;
        overflow-y: auto;
        border-right: 1px solid var(--border);
        background: var(--surface);
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .side-panel fieldset {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.6rem 0.8rem 0.75rem;
        margin: 0;
      }
      .side-panel legend {
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
        padding: 0 0.3rem;
      }

      .canvas-preview-area {
        flex: 1;
        overflow: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 1.5rem;
        background: var(--bg);
      }

      .canvas-preview-area canvas {
        max-width: 100%;
        box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        border-radius: 2px;
      }

      .side-panel textarea {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius);
        padding: 0.4rem 0.5rem;
        font-size: 0.82rem;
        resize: vertical;
        min-height: 80px;
        font-family: inherit;
      }
      .side-panel textarea:focus { outline: none; border-color: var(--accent); }

      .btn-row {
        display: flex;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>flipbook-maker</h1>
      <nav>
        <button class="tab-btn active" data-tab="flipbook">Flipbook</button>
        <button class="tab-btn" data-tab="tarot">Tarot</button>
        <button class="tab-btn" data-tab="cootie">Cootie Catcher</button>
      </nav>
    </header>

    <main id="app">

      <!-- ══ FLIPBOOK TAB ══════════════════════════════════════════════════ -->
      <section id="tab-flipbook" class="tab-section">

        <div id="upload-area">
          <label id="upload-label" for="upload-input">
            ↑ Select video
          </label>
          <input id="upload-input" type="file" accept="video/*" />
          <span id="file-name">No file selected</span>
          <button type="button" id="btn-go" class="action-btn primary" disabled>Go</button>
          <button type="button" id="btn-advanced-toggle" class="action-btn">Advanced ▾</button>
          <div style="margin-left:auto;display:flex;gap:0.5rem;align-items:center;">
            <progress id="render-progress" value="0" max="100" hidden style="width:120px;height:6px;"></progress>
            <button type="button" id="btn-download-pdf" class="action-btn" disabled>PDF</button>
            <button type="button" id="btn-download-png" class="action-btn" disabled>PNGs (ZIP)</button>
          </div>
        </div>

        <div id="advanced-panel" hidden>
          <form id="controls" autocomplete="off">
            <fieldset>
              <legend>Page</legend>
              <div class="field-row">
                <label for="paper">Paper</label>
                <select id="paper" name="paper">
                  <option value="a4" selected>A4</option>
                  <option value="a3">A3</option>
                  <option value="letter">Letter</option>
                  <option value="legal">Legal</option>
                </select>
              </div>
              <div class="field-row">
                <label>Orientation</label>
                <div class="radio-group">
                  <label><input type="radio" name="orientation" value="portrait" checked /> Portrait</label>
                  <label><input type="radio" name="orientation" value="landscape" /> Landscape</label>
                </div>
              </div>
              <div class="field-row">
                <label for="dpi">DPI</label>
                <input id="dpi" type="number" name="dpi" value="150" min="72" max="600" />
              </div>
              <div class="field-row">
                <label for="marginMm">Margin (mm)</label>
                <input id="marginMm" type="number" name="marginMm" value="5" min="0" max="50" step="0.5" />
              </div>
              <div class="field-row">
                <label for="background">Background</label>
                <input id="background" type="text" name="background" value="white" />
              </div>
            </fieldset>

            <fieldset>
              <legend>Grid</legend>
              <div class="field-row">
                <label for="cols">Columns</label>
                <input id="cols" type="number" name="cols" value="2" min="1" max="10" />
              </div>
              <div class="field-row">
                <label for="rows">Rows</label>
                <input id="rows" type="number" name="rows" value="8" min="1" max="20" />
              </div>
              <div class="field-row">
                <label for="pages">Pages</label>
                <input id="pages" type="number" name="pages" value="3" min="1" max="20" />
              </div>
            </fieldset>

            <fieldset>
              <legend>Frame scaling</legend>
              <div class="field-row">
                <label for="fit">Fit mode</label>
                <select id="fit" name="fit">
                  <option value="contain" selected>Contain</option>
                  <option value="cover">Cover</option>
                  <option value="stretch">Stretch</option>
                </select>
              </div>
            </fieldset>

            <fieldset>
              <legend>Decoration</legend>
              <div class="field-row checkbox-row">
                <input type="checkbox" id="cutMarks" name="cutMarks" />
                <label for="cutMarks">Cut marks</label>
              </div>
              <div class="field-row checkbox-row">
                <input type="checkbox" id="cellOutline" name="cellOutline" />
                <label for="cellOutline">Cell outlines</label>
              </div>
              <div class="field-row checkbox-row">
                <input type="checkbox" id="frameNumbers" name="frameNumbers" />
                <label for="frameNumbers">Frame numbers</label>
              </div>
              <div class="field-row">
                <label for="frameNumberColor">Number colour</label>
                <input id="frameNumberColor" type="text" name="frameNumberColor" value="black" />
              </div>
              <div class="field-row">
                <label for="frameNumberOffsetMm">Number offset (mm)</label>
                <input id="frameNumberOffsetMm" type="number" name="frameNumberOffsetMm" value="2" min="0" step="0.5" />
              </div>
            </fieldset>

            <fieldset>
              <legend>Bind strip</legend>
              <div class="field-row">
                <label for="bindStripMm">Width (mm)</label>
                <input id="bindStripMm" type="number" name="bindStripMm" value="0" min="0" max="30" step="0.5" />
              </div>
              <div class="field-row">
                <label for="bindStripColor">Colour</label>
                <input id="bindStripColor" type="text" name="bindStripColor" placeholder="none" />
              </div>
            </fieldset>
          </form>
        </div>

        <div id="preview-area">
          <div id="preview-toolbar">
            <button id="btn-prev-sheet" class="action-btn" disabled>‹</button>
            <span id="sheet-counter">Sheet — / —</span>
            <button id="btn-next-sheet" class="action-btn" disabled>›</button>
          </div>
          <div id="preview-scroll">
            <canvas id="preview-canvas"></canvas>
          </div>
        </div>

      </section>

      <!-- ══ TAROT TAB ═════════════════════════════════════════════════════ -->
      <section id="tab-tarot" class="tab-section" hidden>

        <div class="side-panel">
          <form id="tarot-controls" autocomplete="off">
            <fieldset>
              <legend>Options</legend>
              <div class="field-row">
                <label for="tarot-paper">Paper</label>
                <select id="tarot-paper" name="paper">
                  <option value="a4" selected>A4</option>
                  <option value="a3">A3</option>
                  <option value="letter">Letter</option>
                </select>
              </div>
              <div class="field-row">
                <label for="tarot-dpi">DPI</label>
                <input id="tarot-dpi" type="number" name="dpi" value="150" min="72" max="600" />
              </div>
              <div class="field-row">
                <label for="tarot-seed">Seed</label>
                <input id="tarot-seed" type="number" name="seed" placeholder="random" />
              </div>
              <div class="field-row checkbox-row">
                <input type="checkbox" id="tarot-print" name="print" />
                <label for="tarot-print">Ink-friendly (B&amp;W)</label>
              </div>
            </fieldset>
            <fieldset>
              <legend>Mode</legend>
              <div class="field-row">
                <label>Layout</label>
                <select name="tarotMode">
                  <option value="reading" selected>3-card zine</option>
                  <option value="random">8-card grid</option>
                </select>
              </div>
            </fieldset>
          </form>
          <div class="btn-row">
            <button id="btn-tarot-render" class="action-btn primary" style="flex:1">Generate</button>
            <button id="btn-tarot-download" class="action-btn" disabled style="flex:1">PDF</button>
          </div>
        </div>

        <div class="canvas-preview-area">
          <canvas id="tarot-canvas"></canvas>
        </div>

      </section>

      <!-- ══ COOTIE TAB ════════════════════════════════════════════════════ -->
      <section id="tab-cootie" class="tab-section" hidden>

        <div class="side-panel">
          <form id="cootie-controls" autocomplete="off">
            <fieldset>
              <legend>Page</legend>
              <div class="field-row">
                <label for="cootie-paper">Paper</label>
                <select id="cootie-paper" name="paper">
                  <option value="a4" selected>A4</option>
                  <option value="a3">A3</option>
                  <option value="letter">Letter</option>
                </select>
              </div>
              <div class="field-row">
                <label for="cootie-dpi">DPI</label>
                <input id="cootie-dpi" type="number" name="dpi" value="150" min="72" max="600" />
              </div>
              <div class="field-row">
                <label for="cootie-bg">Background</label>
                <input id="cootie-bg" type="text" name="background" value="white" />
              </div>
            </fieldset>
            <fieldset>
              <legend>Colours (4, comma-separated)</legend>
              <input type="text" name="colors" value="red,blue,green,yellow" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:0.3rem 0.5rem;font-size:0.85rem;" />
            </fieldset>
            <fieldset>
              <legend>Fortunes (8, comma-separated)</legend>
              <textarea name="fortunes">Good fortune awaits,Adventure is near,A surprise today,Be bold,Rest and reflect,Share your joy,New doors open,Trust yourself</textarea>
            </fieldset>
            <fieldset>
              <legend>Display</legend>
              <div class="field-row checkbox-row">
                <input type="checkbox" id="noInstructions" name="noInstructions" />
                <label for="noInstructions">Hide folding instructions</label>
              </div>
            </fieldset>
          </form>
          <div class="btn-row">
            <button id="btn-cootie-render" class="action-btn primary" style="flex:1">Generate</button>
            <button id="btn-cootie-download" class="action-btn" disabled style="flex:1">PDF</button>
          </div>
        </div>

        <div class="canvas-preview-area">
          <canvas id="cootie-canvas"></canvas>
        </div>

      </section>

    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
